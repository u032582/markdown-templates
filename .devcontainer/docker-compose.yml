version: '3.8'

services:
  workspace:
    build:
      context: .
    volumes:
      - ..:/workspace/
  plantuml:
    image: plantuml/plantuml-server:latest
  kroki:
    image: yuzutech/kroki:latest
    environment:
      - KROKI_BLOCKDIAG_HOST=blockdiag
      - KROKI_MERMAID_HOST=mermaid
    depends_on:
      - blockdiag
      - mermaid
  blockdiag:
    image: yuzutech/kroki-blockdiag:latest
  mermaid:
    image: yuzutech/kroki-mermaid:latest